[flake8]
max-line-length = 100
exclude = .git,__pycache__,venv,.venv
ignore = E203,W503
per-file-ignores =
    service/__init__.py: F401,E402

[nosetests]
verbosity = 2
with-spec = 1
spec-color = 1
with-coverage = 1
cover-package = service
cover-erase = 1
cover-inclusive = 1
cover-show-missing = 1

[coverage:run]
branch = True
source = service

[coverage:report]
show_missing = True

[pylint]
max-line-length = 100
disable = C0114,C0115,C0116,E1101
